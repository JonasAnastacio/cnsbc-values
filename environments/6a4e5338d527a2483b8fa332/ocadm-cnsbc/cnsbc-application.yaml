        # Start of cnsbc cli proxy Parameters
        #
        ##################################################################################
        cnsbc-cli-proxy:
          # cliProxy Information about the cnsbc cli proxy
          cliProxy:
            # image Information about the cli proxy image
            image:
              # registry is the name of the container registry where the cli proxy image is available
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the cli proxy image is available within the registry
              # Required;
              # Immutable: No
              repository: "cnsbc"
              # name is the name of the image in registry
              # Optional; Default: cli-proxy
