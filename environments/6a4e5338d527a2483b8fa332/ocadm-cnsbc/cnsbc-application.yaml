            # Immutable: No
            name: ""
          # securityContext defines access control settings for pods deployed as part of the subchart
          # Optional; Default: {}
          securityContext:
            runAsNonRoot: true
          # nodeSelector is the node labels for pod assignment
          # Optional;
          # if set, only following nodeSelector is applied and global nodeSelector ignored
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
          # nodeSelector:
          #   kubernetes.io/hostname: node1
          nodeSelector: {}
          # affinity controls Pod scheduling preferences.
          # Optional;
          # if set, only following affinity is applied and global affinity ignored
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
          affinity: {}
          # tolerations is for nodes that have taints on them.
          # Optional;
          # if set, both following tolerations and global tolerations applied
          # Useful if you want to dedicate nodes to just run the cnsbc-ha-service-manager
          # For example:
          # tolerations:
          # - key: "key"
          #   operator: "Equal"
          #   value: "value"
          #   effect: "NoSchedule"
          #
          # ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
          tolerations: []
          # labels add extra labels to all the resources
          # Optional;
          # if set, both following labels and global labels applied
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
          labels: {}
          # annotations add annotations to all the resources
          # Optional;
          # if set, both following annotations and global annotations applied
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
          annotations: {}
        ##################################################################################
        #
        # End of HA service manager Parameters
        #
        ##################################################################################

        ##################################################################################
        #
        # Start of cnsbc configuration manager Parameters
        #
        ##################################################################################
        cnsbc-configuration-manager:
          # configManager Information about the configuration manager
          configManager:
            # image Information about the configuration manager image
            image:
              # registry is the name of the container registry where the configuration manager image is available
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the configuration manager image is available within the registry
              # Required;
              # Immutable: No
              repository: "cnsbc"
              # name is the name of the image in registry
              # Optional; Default: configuration-manager
              # Immutable: No
              name: "configuration-manager"
              # tag is the version number of the image in the registry
              # Optional;
              # Immutable: No
              tag: "26.0.3"
              # pullPolicy specify a imagePullPolicy
              # Optional; Allowed-values: Always, IfNotPresent, Never; Default: Always
              # Immutable: No
              pullPolicy: "Always"
            backupRestoreAgent:
              # image cnsbc-config image
              image:
                # cnsbc-config image registry
                registry: image-registry.openshift-image-registry.svc:5000
                # cnsbc-config image path
                repository: "cnsbc"
                # name of the image
                name: "backup-restore-agent"
                # Provide a value if you need to override the image tag, which otherwise defaults to the chart appVersion.
                tag: "26.0.3"
                # pullPolicy specify a imagePullPolicy - Possible Values are:- Always, IfNotPresent, Never
                pullPolicy: "Always"
            # resources for cnsbc-configuration-manager container
            # Optional; Default: Small Configuration values
            # CPU and memory configuration recommendation details.
            # Type                     No of Config Elements      Resource Configuration
            # Small Configuration          <8k                    (500m - 1000m) CPU (512Mi - 1Gi) memory
            # Medium Configuration       8k - 80k                 (1000m - 2000m) CPU (512Mi - 3Gi) memory
            # Large Configuration       40k - 80k                 (1500m - 4000m) CPU (512Mi - 5Gi) memory
            # Immutable: No
            resources:
              limits:
                memory: "1Gi"
                cpu: 1
              requests:
                memory: "512Mi"
                cpu: "500m"
            persistentVolumeClaim:
              # storageClassName is the name of the StorageClass provisioned in the cluster that supports ReadWriteOnce access mode
              # Required;
              # Immutable: Yes
              storageClassName: "rook-cephfs"
              resources:
                requests:
                  # storage is the size of the PersistentVolumeClaim required for storing configuration data
                  # Optional; Default: "5Gi";
                  # Immutable: Yes
                  storage: "5Gi"
            # replicas Number of cnsbc-configuration-manager replicas to be deployed
            # Optional; Default: 3
            # Immutable: No
            replicas: 3
            # settings to adjust the liveness probe timings for configuration-manager
            livenessProbe:
              # failureThreshold when a probe fails, kubernetes will try failureThreshold times before giving up.
              # More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
              failureThreshold: 5
              # periodSeconds is how often (in seconds) to perform the probe.
              periodSeconds: 80
            # settings to adjust the readiness probe timings for configuration-manager
            readinessProbe:
              # failureThreshold when a probe fails, kubernetes will try failureThreshold times before giving up.
              # More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
              failureThreshold: 5
              # periodSeconds is how often (in seconds) to perform the probe.
              periodSeconds: 80
            # env environment variables
            # Optional;
            # ref: https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/
            env: []
            # primaryPasswordSecretName User needs to ensure a secret is created before deploying cnsbc application.
            # Required;
            # impact: If Secret is not configured deployment will fail to deploy.
            # Provide the name of the Secret. It will be used to get the primary password.
            # The password provided in this Secret will be used to encrypt the password type attributes of config element
            # Immutable: No
            primaryPasswordSecretName: "primary-password"
          # serviceAccount is the service account to create and assign RBAC roles to
          serviceAccount:
            # create specifies whether a service account should be created
            # Optional; Allowed Values: true, false; Default: true
            # Immutable: No
            create: true
            # name of the service account to use.
            # Required if create is false
            # Behavior:
            #   1. If create = true and name is empty: a new service account is created with a generated name
            #   2. If create = true and name is set: a new service account is created with this name
            #   3. If create = false and name is set: the existing service account with this name will be used
            #   4. If create = false and name is empty: this config is invalid, expect a failure
            #
            # NOTE:
            #   If using an existing service account (i.e., create is set to false), it must have the following permissions:
            #     - resource: secrets, verbs: [get, list]
            #   Ensure the appropriate Kubernetes RBAC resources are configured to grant these permissions.
            # Immutable: No
            name: ""
          # securityContext defines access control settings for pods deployed as part of the subchart
          # fsGroup configured here will not be prioritized for this pod; instead, global.securityContext.fsGroup
          # will be prioritized
          # Optional; Default: {}
          securityContext:
            runAsNonRoot: true
          # nodeSelector is the node labels for pod assignment
          # Optional;
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
          # nodeSelector:
          #   kubernetes.io/hostname: node1
          nodeSelector: {}
          # affinity controls Pod scheduling preferences.
          # Optional;
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
          affinity: {}
          # tolerations is for nodes that have taints on them.
          # Optional;
          #   Useful if you want to dedicate nodes to just run the cnsbc-signaling
          #   For example:
          #   tolerations:
          #   - key: "key"
          #     operator: "Equal"
          #     value: "value"
          #     effect: "NoSchedule"
          #
          #   ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
          tolerations: []
          # labels add labels to all the resources
          # Optional;
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
          labels: {}
          # annotations add annotations to all the resources
          # Optional;
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
          annotations: {}
          # Backup CR specific parameters
          backup:
            periodic: # Whether its periodic backup. Default: true
            frequency: "" # Frequency of backup Default: "1h". Ex: "2h" for every 2 hours, "3m" for every 3 months, "0.5y" for every 6 months.
            timeofday: "" # Required if frequency >= '1d'
            fileName: "" # Backup file name
            backupLoc: "" # Remote backup location specification. Default: s3
            statusReqTimeout: # Timeout for backup operation. Default: 20 (in minutes)
            s3:
              secretAccessKeySecretRef: ""
              path: ""
          # Restore CR specific parameters
          restore:
            fileName: "" # Backup file name
            source: "" # Remote backup location specification. Default: s3
            statusReqTimeout: # Timeout for restore operation. Default: 20 (in minutes)
            s3:
              secretAccessKeySecretRef: ""
              path: ""
        ##################################################################################
        #
        # End of cnsbc configuration manager Parameters
        #
        ##################################################################################

