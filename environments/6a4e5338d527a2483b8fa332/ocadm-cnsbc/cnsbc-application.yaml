              limits:
                memory: "4Gi"
                # hugepages-2Mi: "2Gi"

                hugepages-2Mi: 2Gi
            # vnics to be added to the media
            # Required;
            # VIPs must be configured for vnic type 'pv/Normal'
            # VIPs configuration is optional for vnic type 'vf/Direct'
            # Multiple vnics can be added in the form of an array with fields configured like this:
            #
            # vnics:
            #   - name: <any-user-defined-name>
            #     network-name: <name of the network created>
            #     vips: ["ip1", "ip2"]
