        ##################################################################################
        #
        # Start of cnsbc-log-janitor Parameters
        #
        ##################################################################################
        cnsbc-log-janitor:
          # enabled controls whether the log-janitor CronJob is deployed
          # Optional; Allowed-values: true, false; Default: true
          # Impact: If false, the log-janitor functionality is disabled
          # Immutable: No
          enabled: true
          # schedule defines the cron schedule for running the cnsbc-log-janitor job
          # Format: minute hour day-of-month month day-of-week
          # - minute: 0-59 or */interval (e.g., */5 for every 5 minutes)
          # - hour: 0-23 or * (all hours)
          # - day-of-month: 1-31 or * (all days)
          # - month: 1-12 or * (all months)
          # - day-of-week: 0-7 (0 or 7 is Sunday) or * (all days)
          # Optional; Default: "*/5 * * * *" (runs every 5 minutes)
          # Immutable: No
          schedule: "*/5 * * * *"
          # image Information about the log-janitor image
          image:
            # registry is the name of the container registry where the log-janitor image is available
            # Required;
            # Immutable: No
            registry: *imgRegRef
            # repository is the path/folder structure where the log-janitor image is available within the registry
            # Required;
            # Immutable: No
            repository: "cnsbc"
            # name is the name of the image in registry
            # Optional; Default: "log-janitor"
            # Immutable: No
            name: "log-janitor"
            # tag is the version number of the image in the registry
            # Required;
            # Immutable: No
            tag: "26.0.3"
            # pullPolicy specifies the imagePullPolicy
            # Optional; Allowed-values: Always, IfNotPresent, Never; Default: "IfNotPresent"
            # Immutable: No
            pullPolicy: "Always"
          # highWatermarkPct is the high watermark percentage for triggering cleanup
          # Optional; Default: 80
          # Immutable: No
          highWatermarkPct: 80
          # lowWatermarkPct is the low watermark percentage to stop cleanup
          # Optional; Default: 70
          # Immutable: No
          lowWatermarkPct: 70
          # nodeSelector is the node labels for pod assignment
          # Optional;
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
          # nodeSelector:
          #   kubernetes.io/hostname: node1
          # Immutable: No
          nodeSelector: {}
          # affinity controls Pod scheduling preferences.
          # Optional;
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
          # Immutable: No
          affinity: {}
          # tolerations is for nodes that have taints on them.
          # Optional;
          # Useful if you want to dedicate nodes to just run the log-janitor
          #   For example:
          #   tolerations:
          #   - key: "key"
          #     operator: "Equal"
          #     value: "value"
          #     effect: "NoSchedule"
          #
          #   ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
          # Immutable: No
          tolerations: []
          # securityContext defines access control settings for pods deployed as part of the subchart
          # Optional; Default: {}
          securityContext:
            runAsNonRoot: true
          # enableMetrics enables pushing metrics to Pushgateway
          # Optional; Allowed-values: true, false; Default: false
          # Immutable: No
          enableMetrics: false
          # pushgatewayUrl is the URL of the Prometheus Pushgateway
          # Required if enableMetrics is true
          # Immutable: No
          pushgatewayUrl: ""
          # serviceAccount is the service account to create and assign RBAC roles to
          serviceAccount:
            # create specifies whether a service account should be created
            # Optional; Allowed Values: true, false; Default: true
            # Immutable: No
            create: true
            # name of the service account to use.
            # Required if create is false
            # Behavior:
            #   1. If create = true and name is empty: a new service account is created with a generated name
            #   2. If create = true and name is set: a new service account is created with this name
            #   3. If create = false and name is set: the existing service account with this name will be used
            #   4. If create = false and name is empty: this config is invalid, expect a failure
            #
            # NOTE:
            #   If using an existing service account (i.e., create is set to false), ensure it has permissions suitable for the log-janitor cronjob (e.g., any needed for metrics pushing or storage access).
            #   Ensure the appropriate Kubernetes RBAC resources are configured to grant these permissions.
            # Immutable: No
            name: ""
        ##################################################################################
        #
        # End of cnsbc-log-janitor Parameters
        #
        ##################################################################################

        ##################################################################################
        #
        # Start of helm test subsection
        #
        ##################################################################################
        helmTest:
          # serviceAccountHelmTest is the service account used by Helm to run helm test
          # User can specify an already created SA, by setting create to false
          # A new SA will be created with name <release-name>-helm-test-serviceaccount
          serviceAccount:
            # create specifies whether a service account should be created
            # Optional; Allowed Values: true, false; Default: true
            # Immutable: No
            create: true
            # name of the service account to use.
            # Required if create is false
            # Behavior:
            #   1. If create = true and name is empty: a new service account is created with a generated name
            #   2. If create = true and name is set: a new service account is created with this name
            #   3. If create = false and name is set: the existing service account with this name will be used
            #   4. If create = false and name is empty: this config is invalid, expect a failure
            #
            # NOTE:
            #   If using an existing service account (i.e., create is set to false), it must have the following permissions:
            #     - resource: pods, verbs: [list]
            #     - resource: persistentvolumeclaims, verbs: [list]
            #   Ensure the appropriate Kubernetes RBAC resources are configured to grant these permissions.
            # Immutable: No
            name: ""
          # securityContext defines access control settings for pods deployed as part of the subchart
          # Optional; Default: {}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          # Timeout duration of the readiness checks, Value should be defined in seconds
          # Optional; Default: 300
          # Immutable: No
          timeout: "300"
          # resources configures the maximum resources we can allocate to the helm test
          # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
          resources:
            requests:
              # memory
              # Optional; Default: "1Gi";
              memory: "1Gi"
              # cpu
              # Optional; Default: "300m";
              cpu: "300m"
            limits:
              # memory
              # Optional; Default: "1Gi";
              memory: "1Gi"
              # cpu
              # Optional; Default: "500m";
              cpu: "500m"
          # Information about the helm test image
          image:
            # registry is the name of the container registry where the helm test image is available
            # Required;
            # Immutable: No
            registry: image-registry.openshift-image-registry.svc:5000
            # repository is the path/folder structure where the helm test image is available within the registry
            # Required;
            # Immutable: No
            repository: "cnsbc"
            # name is the name of the image in registry
            # Optional; Default: helm-test
            # Immutable: No
            name: "helm-test"
            # tag is the version number of the image in the registry
            # Required;
            # Immutable: No
            tag: "26.0.3"
            # pullPolicy specify a imagePullPolicy
            # Optional; Allowed-values: Always, IfNotPresent, Never; Default: IfNotPresent
            # Immutable: No
            pullPolicy: "Always"
        ##################################################################################
        #
        # End of helm test subsection
        #
        ##################################################################################

        ##################################################################################
        #
        # Start of Application Grafana Dashboard Parameters
        #
        ##################################################################################

        # Configurations passed to cnsbc-dashboard subchart
        cnsbc-dashboard-application:
          # labels: A map of additional labels to apply to all top-level Kubernetes resources
          # created by this Helm chart (e.g., Deployments, Services, ConfigMaps).
          # Optional; ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
          labels: {}
          # annotations: A map of additional annotations to apply to all top-level Kubernetes resources
          # created by this Helm chart.
          # Optional; ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
          annotations: {}
          dashboard:
            # helmDeployment: A boolean flag to control whether dashboards should be deployed
            # as part of the Helm release. If set to 'true', it enables generation of dashboard resources.
            # Optional; Allowed values: true, false; Default: true
            helmDeployment: true
            # grafanaDashboard: Configuration specific to GrafanaDashboard Custom Resource-based deployments.
            grafanaDashboard:
              # enable: Flag to enable creation of GrafanaDashboard CRs via Grafana Operator.
              # Optional; Allowed values: true, false; Default: true
              enable: false
              # instanceSelector: Defines the label selector to map dashboards to a specific Grafana instance.
              # Required when using Grafana CR-based dashboard deployment.
              # Example:
              # instanceSelector:
              #   matchLabels:
              #     # This should match the labels configured in the target Grafana instance CR.
              #     dashboard: cnsbc
              instanceSelector: {}
              # resyncPeriod: Time interval for the Grafana Operator to resync dashboard state.
              # Optional; Default: 30s; Units: Seconds
              resyncPeriod: 30s
            # configMap: Configuration specific to ConfigMap-based dashboard deployments.
            configMap:
              # enable: If true, dashboards will be created as ConfigMaps instead of GrafanaDashboard CRs.
              # Optional; Allowed values: true, false; Default: false
              enable: true
              # dashboardSelector: Label used by Grafana to detect dashboard ConfigMaps.
              # Optional; Required if enable is true
              # Example:
              # dashboardSelector:
              #   grafana_dashboard: "1"
              dashboardSelector: {}
        ##################################################################################
        #
        # End of Application Grafana Dashboard Parameters
        #
        ##################################################################################

        ##################################################################################
        #
        # Start of cnsbc-application-alerts Parameters
        #
        ##################################################################################
        cnsbc-application-alerts:
          # This parameter is to disable all the alerts
          # Optional;
          # If it is set to true all the below alerts would not apply
          # Default value for the parameter is set to false
          disableAllAlerts: false
          # Following is the template for the configuration parameters
          # All of the parameters are Optional and filled with default values
          # <Alert-Name>:
          #   - enabled: true/false                      # Set it false to disable an alert and true to enable it, default is enabled
          #     severity: warning/minor/major/critical   # Severity value for an alert, default value of warning/minor/major/critical is provided for each alert
          #     thresholds:                              # Contains key value pair containing thresholds configurable for an alert, if it is not present then threshold is not configurable
          #       <Threshold name>: <value>              # Uses this to edit threshold of an alert, it is provided for alerts with configurable threshold, additional thresholds cannot be added
          #     for: <value>                             # Controls 'for' value in an alert rule, it is an optional parameter and not present for all alerts
          #     additionalLabels: {}                     # Additional Labels can be added using this field, provide label in the form of key value pair
          #     additionalAnnotations: {}                # Additional Annotations can be added using this field, provide annotation in the form of key value pair
          # Edit the below values to modify the default values in alerting rules
          alerts: {}
          # Alerts values are provided in cnsbc-application-alerts-values.yaml
        ##################################################################################
        #
        # End of cnsbc-application-alerts Parameters
        #
        ##################################################################################

  destination:
    server: https://kubernetes.default.svc
    namespace: ocadm-cnsbc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
