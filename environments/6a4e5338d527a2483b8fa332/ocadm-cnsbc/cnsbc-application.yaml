apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnsbc-application
  namespace: argocd
  labels:
    automated: ""
    ocadmInstanceId: "6aa8eff034808551a79c27a2"
    ocadmInstanceType: cnsbc
    ocadmDeploymentMode: argocd
    ocadmHelmRelease: "ocadm-cnsbc-application"
    ocadmTargetNamespace: "ocadm-cnsbc"
    ocadmTrackingAnchor: "true"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  ignoreDifferences:
  - group: cgbu.oracle.com
    kind: CnsbcApp
    jqPathExpressions:
    - '.metadata.labels["com.oracle.cnsbc.operator/owner"]'
    - '.spec.resourceTemplate.status'
    - '.spec.resourceTemplate.spec.template.spec.containers[] | .ports[]? | .protocol'
    - '.spec.resourceTemplate.spec.template.spec.containers[] | .env[]? | select(.valueFrom.resourceFieldRef? != null) | .valueFrom.resourceFieldRef.divisor'
    - '.spec.resourceTemplate.spec.template.spec.containers[] | select(.resources.limits.cpu != null) | .resources.limits.cpu'
    - '.spec.resourceTemplate.spec.template.spec.securityContext.supplementalGroups | select(. == [])'
  source:
    repoURL: https://chartmuseum-helm-repository.apps.ocp1.cgiunet
    chart: cnsbc-application
    targetRevision: "26.0.3"
    helm:
      releaseName: ocadm-cnsbc-application
      values: |
        # YAML consisting of parameters used to deploy the Cloud Native SBC application Helm chart
        # Fields marked as "Immutable: Yes" must not be changed after initial Helm installation or any subsequent Helm upgrade,
        # as this could cause unexpected behaviors or deployment issues.

        ##################################################################################
        #
        # Start of Global Parameters
        #
        ##################################################################################

        global:
          # imageRegistry from where the image should be pulled
          # Required;
          # Immutable: No
          imageRegistry: &imgRegRef "image-registry.openshift-image-registry.svc:5000"
          # imagePullSecrets provides support pulling images from private registries
          # Optional;
          # Impact: Not providing secrets may cause image pull failures while deploying pods
          # The value references one or more secrets to be used when pulling images.
          # Secrets must be manually created in the target namespace.
          # ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
          # imagePullSecrets
          # - name: secretname1
          # - name: secretname2
          # Immutable: No
          imagePullSecrets: []
          # namePrefix is used to form resource name as: namePrefix/Release-name + chart-name + custom-resource-name
          # Optional;
          # If it is empty then Helm release-name will be taken as a prefix
          # Immutable: No
          namePrefix: ""
          trace:
            # serviceName name of the service that can be configured to reach tracing service
            # Optional; Allowed-values: FQDN, FQDN:Port, IP, IP:Port
            # Default port is 4318
            # Immutable: No
            serviceName: ""
            # clientType type of content that the tracing server supports
            # Optional; Allowed-values: http/protobuf", "http/json"; Default: http/protobuf
            # Immutable: No
            clientType: "http/protobuf"
          # securityContext defines access control settings for all the pods
          # deployed as part of this Helm chart
          # Mandatory
          securityContext:
            # runAsUser for the pod
            # Optional; Default: 10000
            # Immutable: Yes
            runAsUser: 10000
            # runAsGroup for the pod
            # Optional; Default: 20000
            # Immutable: Yes
            runAsGroup: 20000
            # fsGroup for the pod
            # Mandatory;
            # Immutable: Yes
            # fsGroup configuration is dependent on the squashing setting of NFS server
            # Refer the below table as an example -
            #---------------------------------------------#
            #    squashing     | anongid |    fsGroup     |
            #---------------------------------------------#
            #                  |  20000  |     20000      |
            #  root_squashing  |---------|----------------#
            #                  | Not Set |  65534(nobody) |
            #---------------------------------------------#
            #                  |  20000  |     20000      |
            #   all_squashing  |---------|----------------#
            #                  | Not Set |  65534(nobody) |
            #---------------------------------------------#
            #                  |  20000  |   Any value    |
            # no_root_squashing|---------| allowed by the |
            #                  | Not Set |     setup      |
            #---------------------------------------------#
            #
            fsGroup: 1000760000
            # fsGroupChangePolicy defines behavior for changing ownership and permissions of the
            # volume before being exposed inside a Pod
            # Immutable: Yes
            fsGroupChangePolicy: "OnRootMismatch"
            # supplementalGroups control which supplemental group ID can be assigned to processes in a pod.
            # Optional;
            # A list of groups specified here will be applied to the first process run in each container,
            # in addition to the container's primary GID set above
            # This might be useful in certain cases where shared volume(NFS share) groupId is different
            # from the value as specified under "groupId" field
            # Immutable: Yes
            supplementalGroups: []
          # enableTranscoding setting this flag to true will enable transcoding resource deployment
          # Optional; Allowed-values: true, false; Default: false
          # Impact: setting to false will not deploy transcoding resources. So transcoding functionality will not work
          # Immutable: No
          enableTranscoding: false
          # enableRemoteSync setting this flag to true will enable the microservice to access configuration data from
          # & write troubleshooting data to local ephemeral storage which will be synced to the remote storage using rsync
          # Optional; Allowed-values: true, false; Default: false
          # NOTE: This feature needs to be enabled when NFS storageClass PVCs are used
          # for storing persistent data like configuration & troubleshooting data.
          enableRemoteSync: false
          # enableBackup setting this flag to true will enable backup CR deployment
          # Valid values needs to be configured in backup field if its true
          # If flag is false, backup CR will not be deployed
          # Optional; Allowed-values: true, false; Default: false
          enableBackup: false
          # enableRestore setting this flag to true will enable restore CR deployment
          # Valid values needs to be configured in restore field if its true
          # If flag is false, restore CR will not be deployed
          # Optional; Allowed-values: true, false; Default: false
          enableRestore: false
          # persistentVolumeClaim persistent storage management for cnsbc application
          persistentVolumeClaim:
            # configuration will store data for RBT, LRT, CA certificates, and licenses
            # cnsbc-media, cnsbc-signaling, cnsbc-transcode, cnsbc-file-manager, cnsbc-configuration-manager subcharts will use this PVC
            configFiles:
              # storageClassName is the name of the StorageClass provisioned in the cluster that supports ReadWriteMany access mode
              # Required;
              # Immutable: Yes
              storageClassName: "rook-cephfs"
              resources:
                requests:
                  # storage is the size of the PersistentVolumeClaim required for storing RBT, LRT, CA certificates, and licenses data
                  # Optional; Default: "1Gi";
                  # Immutable: Yes
                  storage: "1Gi"
            # troubleshooting will store the data for troubleshoot including packet and protocol trace, and crash logs
            # cnsbc-media, cnsbc-signaling, cnsbc-transcode, cnsbc-file-manager subcharts will use this PVC
            troubleshooting:
              # storageClassName is the name of the StorageClass provisioned in the cluster that supports ReadWriteMany access mode
              # Required;
              # Immutable: Yes
              storageClassName: "rook-cephfs"
              resources:
                requests:
                  # storage is the size of the PersistentVolumeClaim required for storing troubleshooting data
                  # Optional; Default: "1Gi";
                  # Immutable: Yes
                  storage: "1Gi"
            # archival will store the archived configuration while performing backup and restore process
            # cnsbc-configuration-manager subchart will use this PVC
            archivalFiles:
              # storageClassName is the name of the StorageClass provisioned in the cluster that supports ReadWriteMany access mode
              # Required;
              # Immutable: Yes
              storageClassName: ""
              resources:
                requests:
                  # storage is the size of the PersistentVolumeClaim required for storing RBT, LRT, CA certificates, and licenses data
                  # Optional; Default: "6Gi";
                  # NOTE: This value should be sum(configFiles.resources.storage + configManager.persistentVolumeClaim.resources.storage)
                  # Immutable: Yes
                  storage: "6Gi"
                  # ephemeralVolumes temporary storage management for cnsbc application
          ephemeralVolumes:
            # emptyDirs is a type of ephemeral storage that provides an empty directory within a pod for temporary data storage
            emptyDirs:
              # localStorage will store the local copy of configuration data RBT, LRT, CA certificates, and licenses) & troubleshooting data (packet and protocol traces, and crash logs)
              # cnsbc-media, cnsbc-signaling, cnsbc-transcode subcharts will use this volume
              localStorage:
                # sizeLimit is the total amount of storage required for storing local copy of configuration and troubleshooting data
                # Optional; Default: "2Gi";
                sizeLimit: "2Gi"
              # localConfig will store the local copy of micro service specific configuration SE/ME/TE
              # cnsbc-media, cnsbc-signaling, cnsbc-transcode subcharts will use this volume
              localConfig:
                # sizeLimit is the total amount of storage required for storing local copy of configuration backup
                # Optional; Default: "1Gi";
                sizeLimit: "1Gi"
          # Start of global level bootstrap subsection - Applicable to signaling and media
          bootstrap:
            # desiredActiveMediaEngines defines number of active media engines in a cluster
            # Optional; Default: 1;
            # Follow sizing guidelines provided by Oracle to set the right values for these parameters
            # Immutable: Yes
            desiredActiveMediaEngines: 1
            # desiredStandbyMediaEngines defines number of standby media engines in a cluster
            # Optional; Default: 1;
            # Follow sizing guidelines provided by Oracle to set the right values for these parameters
            # Immutable: Yes
            desiredStandbyMediaEngines: 1
            # desiredActiveTranscodeEngines defines number of active transcode engines in a cluster
            # Optional; Default: 1;
            # Follow sizing guidelines provided by Oracle to set the right values for these parameters
            # Immutable: Yes
            desiredActiveTranscodeEngines: 1
            # desiredStandbyTranscodeEngines defines number of standby transcode engines in a cluster
            # Optional; Default: 1;
            # Follow sizing guidelines provided by Oracle to set the right values for these parameters
            # Immutable: Yes
            desiredStandbyTranscodeEngines: 1
          # End of global level bootstrap subsection - Applicable to signaling and media

          # enableMetricsAllowList When set to true, only the metrics listed in metrics-allowlist ConfigMap will be exported
          # by SE, ME & TE micro services. if set to false, then all the metrics will be exported
          # Optional; Allowed-Values: true, false; Default: true;
          # impact: When this flag is set to false, cardinality of metrics that are being exported to Prometheus by SE/ME/TE will increase based on configuration
          # Immutable: No
          enableMetricsAllowList: true
          # Start of global level tls parameters subsection
          tls:
            # certificates contains the list of TLS certificates signed by certificate authority
            # Optional;
            # cert-manager adds certificates as resource types in the Kubernetes cluster
            # Immutable: No
            certificates: []
            # Below is an example which shows the mandatory parameters of TLS certificate
            # certificates:
            #   - name: tls-certificate-1 #name of the certificate
            #     #commonName to be used on the certificate
            #     commonName: tlscertcommon.com
            #     #organizations list to be used on the certificate
            #     organizations:
            #       - Engineering
            #     #organizationalUnits list to be used on the certificate
            #     organizationalUnits:
            #       - CGBU
            #     #countries list to be used on the Certificate.
            #     countries:
            #       - US
            #     #localities list of Cities to be used on the Certificate.
            #     localities:
            #       - MA
            #     #provinces list of State/Provinces to be used on the Certificate
            #     provinces:
            #       - Burlington
            #     #duration the requested 'duration' (i.e. lifetime) of the Certificate
            #     #default value 2160h (90 days). Valid time units are "ns","us"(or "µs),"ms","s","m","h".
            #     duration: 2160h
            #     #renewBefore time before the currently issued certificate's expiry
            #     #cert-manager should renew the certificate. default is 2/3 times of duration
            #     #Valid time units are "ns", "us" (or "µs"), "ms", "s", "m", "h".
            #     renewBefore: 24h
            #     #At least one of a DNS Name, URI, or IP address is required
            #     #dnsNames list of DNS subjectAltNames to be set on the Certificate
            #     dnsNames:
            #       - tlscertdns.com
            #     #uris is a list of URI subjectAltNames to be set on the Certificate
            #     uris:
            #     #ipAddresses is a list of IP address subjectAltNames to be set on the Certificate
            #     ipAddresses:
            #     #emailAddresses list of email subjectAltNames to be set on the certificate.
            #     emailAddresses:
            #       - support@engineering.com
            #     #secretName is the name of the secret in which the signed certificate will be stored.
            #     #Since this secret will be generated automatically, providing the secret name is required.
            #     secretName: tls-secret-1
            #     #issuerRef References a properly configured ACME-type Issuer used to create this challenge
            #     issuerRef:
            #       #name of the resource being referred to
            #       name: root-issuer
            #       #kind of the resource being referred to. Allowed values are Issuer or clusterIssuer
            #       kind: Issuer
            #       #group of the resource being referred to. This is optional since cert-manager will
            #       #default to this value however if you are using an external issuer, change this to that issuer group.
            #       group: cert-manager.io
            #     #usages is the set of x509 usages that are requested for the certificate.
            #     #Default values are digital signature, server auth and key encipherment
            #     usages:
            #       - server auth
            #       - digital signature
            #       - key encipherment
            #     #privateKey options to control private keys used for the certificate.
            #     privateKey:
            #       #encoding private key cryptography standards(PKCS) encoding for this certificate's private key
            #       #to be encoded in. Allowed values are PKCS1 and PKCS8. Default value is PKCS1
            #       encoding: PKCS1
            #       #algorithm is the private key algorithm of the corresponding private key for this certificate
            #       #Allowed values are RSA and ECDSA. Default value is RSA
            #       algorithm: RSA
            #       #size is the key bit size of the corresponding private key for this certificate.
            #       #If algorithm is RSA valid values for size are 2048/4096/8192. Default 2048
            #       #If algorithm is ECDSA valid values for size are 256/384/521. Default 256
            #       size: 2048
          # End of global level tls parameters subsection

          # nodeSelector is the node labels for pod assignment
          # Optional;
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
          # nodeSelector:
          #   kubernetes.io/hostname: node1
          # Immutable: No
          nodeSelector: {}
          # affinity controls Pod scheduling preferences.
          # Optional;
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
          # Immutable: No
          affinity: {}
          # tolerations is for nodes that have taints on them.
          # Optional;
          #   Useful if you want to dedicate nodes to just run the cnsbc-signaling
          #   For example:
          #   tolerations:
          #   - key: "key"
          #     operator: "Equal"
          #     value: "value"
          #     effect: "NoSchedule"
          #
          #   ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
          # Immutable: No
          tolerations: []
          # labels add labels to all the resources
          # Optional;
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
          # NOTE: if you modify labels, it would recreate application pods and may cause service disruption
          # Immutable: No
          labels: {}
          # annotations add annotations to all the resources
          # Optional;
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
          # NOTE: if you modify annotations, it would recreate application pods and may cause service disruption
          # Immutable: No
          annotations: {}
          # Start of global level initContainer image section
          initContainer:
            # Information about the initContainer image
            image:
              # registry initContainer image registry
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository initContainer image path
              # Required;
              # user needs to provide the value of repository , example : reference
              # Immutable: No
              repository: "cnsbc"
              # name initContainer image name
              # Optional; Default: cnsbc-utility
              # Immutable: No
              name: "cnsbc-utility"
              # tag initContainer image tag
              # Required;
              # Immutable: No
              tag: "26.0.3"
              # pullPolicy specify a imagePullPolicy
              # Optional; Allowed-values: Always, IfNotPresent, Never; Default: IfNotPresent
              # Immutable: No
              pullPolicy: "IfNotPresent"
          # End of global level initContainer image section

          # Start of global level coherence image reference section
          coherence:
            # Information about the coherence image
            image:
              # registry is the name of the container registry where the coherence image is available
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the coherence image is available within the registry
              # Required;
              # Immutable: No
              repository: "cnsbc"
              # name is the name of the image in registry
              # Optional; Default: coherence_cpu
              # Immutable: No
              name: "coherence_cpu"
              # tag is the version number of the image in the registry
              # Required;
              # Immutable: No
              tag: "14.1.2.0.4"
              # pullPolicy specify a imagePullPolicy
              # Optional; Allowed-values: Always, IfNotPresent, Never; Default: IfNotPresent
              # Immutable: No
              pullPolicy: "Always"
            # securityContext defines access control settings for pods deployed as part of subchart
            # Optional; Default: {}
            securityContext:
              runAsNonRoot: true
          # fluentBit container image details
          fluentBit:
            # image Information about the fluentBit image
            image:
              # registry is the name of the container registry where the fluentBit image is available
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the fluentBit image is available within the registry
              # Required;
              # Immutable: No
              repository: "cnsbc"
              # name is the name of the image in registry
              # Optional; Default: fluent-bit
              # Immutable: No
              name: "fluent-bit"
              # tag is the version number of the image in the registry
              # Required;
              # Immutable: No
              tag: "26.0.3"
              # pullPolicy specify a imagePullPolicy
              # Optional; Allowed-values: Always, IfNotPresent, Never; Default: IfNotPresent
              # Immutable: No
              pullPolicy: "Always"
          # rsync container image details
          rsync:
            # image Information about the rsync image
            image:
              # registry is the name of the container registry where the rsync image is available
              # Required;
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the rsync image is available within the registry
              # Required;
              repository: "cnsbc"
              # name is the name of the image in registry
              # Optional; Default: rsync
              name: "rsync"
              # tag is the version number of the image in the registry
              # Required;
              tag: "26.0.3"
              # pullPolicy specify a imagePullPolicy
              # Optional; Allowed-values: Always, IfNotPresent, Never; Default: IfNotPresent
              pullPolicy: "Always"
          serviceNetworks:
            - name: cnsbc_net
              cidr: 11.0.2.0/24
              gatewayip: 11.0.2.1
              mtu: 1500
        ##################################################################################
        #
        # End of Global Parameters
        #
        ##################################################################################

        ##################################################################################
        #
        # Start of cnsbc-signaling Parameters
        #
        ##################################################################################
        cnsbc-signaling:
          # replicas  Number of signaling engines that will be deployed.
          # Optional; Allowed-values: 1 or 2; Default: 2
          # 1 - One Active signaling engine 2 - One Active & one Standby signaling engine
          # Immutable: Yes
          replicas: 2
          # signaling Information about the signaling engine image
          signaling:
            # image Information about the signaling engine image
            image:
              # registry is the name of the container registry where the signaling image is available
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the cnsbc-signaling image is available within the registry
              # Required;
              # Immutable: No
              repository: "cnsbc"
              # name is the name of the image in registry
              # Optional; Default: cnsbc-signaling
              # Immutable: No
              name: "cnsbc-signaling"
              # tag is the version number of the image in the registry
              # Optional;
              # Immutable: No
              tag: "26.0.3"
              # pullPolicy specify a imagePullPolicy
              # Optional; Allowed-values: Always, IfNotPresent, Never; Default: IfNotPresent
              # Immutable: No
              pullPolicy: "Always"
            # resources is the maximum resources we can allocate to the cnsbc-signaling container
            # Optional;
            # cpu limit will be derived from cores configured (signaling + forwarding + 1(dos))
            # Immutable: No
            # resources:
            #   limits:
            #     memory: "4Gi"
            #     hugepages-2Mi: "2Gi"
            resources:
              limits:
                memory: "4Gi"
                hugepages-2Mi: "2Gi"
            vnics:
              openstack:
                - name: "net0"
                  network-name: "cnsbc_net"
                  vips: ["11.0.2.10"]
                  secgroup: ["507b536b-92ba-4724-8298-1743b630caf4"]
            # metricsAllowList is the list of additional metrics that will be exported by the cnsbc-signaling component.
            # Optional; Default: [];
            # These metrics will be added to the default set and included in the ConfigMap used by the application.
            # Do not change this field here. To add additional metrics, specify them in metrics-allowlist.yaml only.
            metricsAllowList: []
            # log defines the log level for processes/tasks in signaling engine
            log:
              # level allows to configure task/process wide logging information
              # Optional; Allowed-values: Fatal, Error, Warn, Info, Debug, trace; Default: Info
              # Immutable: No
              level:
                usbc-proc: "Info"
                usdp-proc: "Info"
          # On SMT-enabled systems with 'full-pcpu-only' enabled in static CPU management policy:
          # - The total core count assigned to the container must be a multiple of the SMT threads per physical core.
          #   For example, with 2 threads per core, the total CPU count must be a multiple of 2.
          # - Examples of Valid configurations (dosCore is hardcoded to 1 by default) include:
          #   totalCores = signalingCores + forwardCores + dosCores:1
          #   Ex1: totalCores = 4 = signalingCores:2 + forwardCores:1 + dosCores:1
          #   Ex2: totalCores = 4 = signalingCores:1 + forwardCores:2 + dosCores:1
          # start of bootstrap section for signaling
          bootstrap:
            # forwardCores number of cores allocated for media processing
            # Optional; Default: 1
            # Immutable: No
            forwardCores: 1
            # signalingCores number of cores allocated for signaling process
            # Optional; Default: 1
            # Immutable: No
            signalingCores: 1
          # End of bootstrap section for signaling

          # start of signaling database section
          signalingDatabase:
            # replicas number of signaling database pods that will be deployed
            # Optional; Default: 3
            # Immutable: No
            replicas: 3
            # resources for signaling database pods
            # On SMT-enabled systems with 'full-pcpu-only' enabled in static CPU management,
            # the total CPU resource limit assigned to a container must be a multiple of SMT threads per physical core.
            # For example, with 2 threads per core, the CPU limit must be a multiple of 2.
            # Optional;
            # resources:
            #   limits:
            #     memory: "1Gi"
            #     cpu: 1
            # Immutable: No
            resources:
              limits:
                memory: "1Gi"
                cpu: 1
            # jvm heap memory for signaling database pods
            # when Heap memory of the signalingDatabase cluster need to be allocated
            # manually with a certain value, else Operator will
            # allocate the twenty-five percent of signalingDatabase pod memory as
            # pod heap memory during signalingDatabase cluster deployment
            # Optional;
            # Immutable: Yes
            jvm:
              memory:
                heapSize: ""
          # End of signaling database section

          # start of CDR(call detail records) section
          accounting:
            # enabled if set, CDR(call detail records) will be generated and cdrManager will be deployed
            # Optional; Allowed Values: true, false; Default: false;
            # Immutable: Yes
            enabled: false
          # cdrManager is deployed as a sidecar container along with signaling container
          # dependencies: cdrManager will be deployed only if accounting is enabled
          cdrManager:
            # cdr-manager image
            image:
              # registry is the name of the container registry where the xfer-service image is available
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the xfer-service image is available within the registry
              # Required;
              # Immutable: No
              repository: "cnsbc"
              # name is the name of the image in registry
              # Optional; Default: xfer-service
              # Immutable: No
              name: "xfer-service"
              # tag is the version number of the image in the registry
              # Required when accounting is enabled
              # Immutable: No
              tag: "26.0.3"
              # pullPolicy specify a imagePullPolicy
              # Optional; Allowed-values: Always, IfNotPresent, Never; Default: Always
              # Immutable: No
              pullPolicy: "Always"
            # resources for cdr-manager container
            # Optional;
            # resources:
            #   limits:
            #     memory: "256Mi"
            #     cpu: "500m"
            # Immutable: No
            resources:
              limits:
                memory: "256Mi"
                cpu: "500m"
            # persistentVolumeClaim will store the data for CDR
            persistentVolumeClaim:
              # storageClassName is the name of the StorageClass provisioned in the cluster that supports ReadWriteOnce access mode. It must be based on block storage.
              # Required;
              # Immutable: Yes
              storageClassName: "rook-cephfs"
              resources:
                requests:
                  # storage is the size of the PersistentVolumeClaim required for storing CDR data
                  # Optional; Default: "1Gi";
                  # Immutable: Yes
                  storage: "1Gi"
            # start of file transfer service parameters for cdr-manager container
            sftp:
              server:
                # secretName specify the name of the secret.
                # This secret will be utilized to retrieve the remote SFTP Server credentials.
                # The secret must include "username" and "password" fields, representing the SFTP Server Username and SFTP Server Password.
                # Required, if accounting is enabled
                # Immutable: No
                secretName: ""
                # serviceName takes SFTP server's FQDN or service name as input, which will be the target server for file transmission using SFTP
                # dependencies: if serviceName is not specified, ipAddresses below is required.
                # Required, if accounting is enabled
                # Immutable: No
                serviceName: ""
                # ipAddresses is the list of IPs which will be the recipient for the SFTP file transmission
                # Optional, if serviceName is configured
                # Provide the list of IPs of remote SFTP server to which file needs to be transferred. Example -->
                # ipAddresses:
                #   - ip: 10.233.61.47
                #   - ip: 10.233.26.5
                # Immutable: No
                ipAddresses: []
                # port is the port of the SFTP service
                # Optional; Default: 22
                # Immutable: No
                port: 22
                # remotePath is the SFTP server's directory path where the files will be transferred.
                # Optional; Default: "cnsbc_sftp/cdr"
                # Immutable: No
                remotePath: "cnsbc_sftp/cdr"
                # knownhosts is the knownhosts information of the SFTP server, which will be used to validate that
                # file is getting transferred to trusted server.
                # To get knownhosts data use command: ssh-keyscan example-sftp-server.com  or ssh-keyscan 10.1.1.15
                # Reference: https://man.openbsd.org/ssh-keyscan  https://en.wikibooks.org/wiki/OpenSSH/Client_Configuration_Files#About_the_Contents_of_the_known_hosts_Files
                # For example:
                #   When single value in knownhosts
                #   knownhosts: "10.1.1.15:22 ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQCvj9ZXbpJM0OPsZufjGzF6qtIuIsG3xFIKsPgHdUZROhlgyi"
                #   When multiple values in knownhosts, separate them with \n (new line character)
                #   knownhosts: "10.1.1.15:22 ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQCvj9ZXbpJM0OPsZufjGzF6qtIuIsG3xFIKsPgHdUZROhlgyi
                #                \n10.1.1.15:22 ssh-rsa AAAAB3NzaC1yc2EAAAADAQDKLJEFEgQCvj9ZXbpJM0OPsZufjGzF6qtIuIsG3xFIKkjskjdMSNsyi"
                # Required, if accounting is enabled
                # Immutable: No
                knownhosts: ""
              client:
                # destinationFilePrefix is a prefix appended to the file name that gets transmitted
                # Optional; Default: ""
                # Immutable: No
                destinationFilePrefix: ""
                # numberThreads is number of worker threads to run the SFTP operations
                # Optional; Default: "2"
                # Immutable: No
                numberThreads: 2
                # compressOnTransit defines the files that need to be transferred should be compressed or not
                # Optional; Allowed-Values: true, false;  Default: true
                # true - gzip compression; false - no compression
                # Immutable: No
                compressOnTransit: true
                # totalDiskSpaceInKBs total usable disk space in kilobytes.
                # Optional; Default: 1000000
                # Immutable: No
                totalDiskSpaceInKBs: 1000000
                # End of file transfer service parameters for cdr-manager container
          # serviceAccount is the service account to create and assign RBAC roles to
          serviceAccount:
            # create specifies whether a service account should be created
            # Optional; Allowed Values: true, false; Default: true
            # Immutable: No
            create: true
            # name of the service account to use.
            # Required if create is false
            # Behavior:
            #   1. If create = true and name is empty: a new service account is created with a generated name
            #   2. If create = true and name is set: a new service account is created with this name
            #   3. If create = false and name is set: the existing service account with this name will be used
            #   4. If create = false and name is empty: this config is invalid, expect a failure
            #
            # NOTE:
            #   If using an existing service account (i.e., create is set to false), it must have the following permissions:
            #     - resource: secrets, verbs: [get, list]
            #     - resource: podsecuritypolicies, verbs: [use]
            #   Ensure the appropriate Kubernetes RBAC resources are configured to grant these permissions.
            # Immutable: No
            name: ""
          # securityContext defines access control settings for pods deployed as part of the subchart
          # Optional; Default: {}
          # runAsUser and runAsGroup is not configurable for the main pod; instead, provided fields will
          # be configured only for the init-container
          # fsGroup configured here will not be prioritized for this pod; instead, global.securityContext.fsGroup
          # will be prioritized
          securityContext: {}
          # nodeSelector is the node labels for pod assignment
          # Optional;
          # if set, only following nodeSelector is applied and global nodeSelector ignored
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
          # nodeSelector:
          #   kubernetes.io/hostname: node1
          # Immutable: No
          nodeSelector: {}
          # affinity controls Pod scheduling preferences.
          # Optional;
          # if set, only following affinity is applied and global affinity ignored
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
          # Immutable: No
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/worker
                        operator: Exists
                      - key: node-role.kubernetes.io/master
                        operator: DoesNotExist
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          # tolerations is for nodes that have taints on them.
          # Optional;
          # if set, both following tolerations and global tolerations applied
          # Useful if you want to dedicate nodes to just run the cnsbc-signaling
          #   For example:
          #   tolerations:
          #   - key: "key"
          #     operator: "Equal"
          #     value: "value"
          #     effect: "NoSchedule"
          #
          #   ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
          # Immutable: No
          tolerations: []
          # labels add labels to all the resources
          # Optional;
          # if set, both following labels and global labels applied
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
          # Immutable: No
          labels: {}
          # annotations add annotations to all the resources
          # Optional;
          # if set, both following annotations and global labels applied
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
          # Immutable: No
          annotations: {}
        ##################################################################################
        #
        # End of cnsbc-signaling Parameters
        #
        ##################################################################################

        ##################################################################################
        #
        # Start of cnsbc-media Parameters
        #
        ##################################################################################
        cnsbc-media:
          # media Information about the media engine
          media:
            # image Information about the media engine image
            image:
              # registry is the name of the container registry where the media image is available
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the cnsbc-media image is available within the registry
              # Required;
              # Immutable: No
              repository: "cnsbc"
              # name is the name of the image in registry
              # Optional; Default: cnsbc-media
              # Immutable: No
              name: "cnsbc-media"
              # tag is the version number of the image in the registry
              # Optional;
              # Immutable: No
              tag: ""
              # pullPolicy specify a imagePullPolicy
              # Optional; Allowed-values: Always, IfNotPresent, Never; Default: Always
              # Immutable: No
              pullPolicy: "Always"
            # resources is the maximum resources we can allocate to the cnsbc-media container
            # Optional;
            # cpu limit will be derived from cores configured (signaling + forwarding)
            # resources:
            #   limits:
            #     memory: "4Gi"
            #     hugepages-2Mi: "2Gi"
            # Immutable: No
            resources:
              limits:
                memory: "4Gi"
                hugepages-2Mi: "2Gi"
            vnics:
              openstack:
                - name: "net0"
                  network-name: "cnsbc_net"
                  vips: ["11.0.2.11"]
                  secgroup: ["507b536b-92ba-4724-8298-1743b630caf4"]
            # metricsAllowList is the list of additional metrics that will be exported by the cnsbc-media component.
            # Optional; Default: [];
            # These metrics will be added to the default set and included in the ConfigMap used by the application.
            # Do not change this field here. To add additional metrics, specify them in metrics-allowlist.yaml only.
            metricsAllowList: []
            # log defines the log level for processes/tasks in media engine
            log:
              # level allows to configure task/process wide logging information
              # Optional; Allowed-values: Fatal, Error, Warn, Info, Debug, trace; Default: Info
              # Immutable: No
              level:
                usbc-proc: "Info"
                usdp-proc: "Info"
          # On SMT-enabled systems with 'full-pcpu-only' set in static CPU management:
          # - The total core count assigned to the container must be a multiple of SMT threads per physical core.
          #   For example, with 2 threads per core, valid total core counts are multiples of 2.
          # - Examples of valid configurations include:
          #   totalCores = signalingCores + forwardCores
          #   Ex1: totalCores = 4 = signalingCores:2 + forwardCores:2
          #   Ex2: totalCores = 4 = signalingCores:1 + forwardCores:3
          # start of bootstrap section for media
          bootstrap:
            # forwardCores number of cores allocated for media processing
            # Optional; Default: 1
            # Immutable: No
            forwardCores: 1
            # signalingCores number of cores allocated for signaling process
            # Optional; Default: 1
            # Immutable: No
            signalingCores: 1
          # End of bootstrap section for media

          # start of media database section
          mediaDatabase:
            # replicas number of media database pods that will be deployed
            # Optional; Default: 3
            # Immutable: No
            replicas: 3
            # resources for media database pods
            # On SMT-enabled systems with 'full-pcpu-only' enabled in static CPU management,
            # the total CPU resource limit assigned to a container must be a multiple of SMT threads per physical core.
            # For example, with 2 threads per core, the CPU limit must be a multiple of 2.
            # Optional;
            # resources:
            #   limits:
            #     memory: "1Gi"
            #     cpu: 1
            # Immutable: No
            resources:
              limits:
                memory: "1Gi"
                cpu: 1
            # jvm heap memory for media database pods
            # when Heap memory of the mediaDatabase cluster need to be allocated
            # manually with a certain value, else Operator will
            # allocate the twenty-five percent of mediaDatabase pod memory as
            # pod heap memory during mediaDatabase cluster deployment
            # Optional;
            # Immutable: Yes
            jvm:
              memory:
                heapSize: ""
          # End of media database section

          # serviceAccount is the service account to create and assign RBAC roles to
          serviceAccount:
            # create specifies whether a service account should be created
            # Optional; Allowed Values: true, false; Default: true
            # Immutable: No
            create: true
            # name of the service account to use.
            # Required if create is false
            # Behavior:
            #   1. If create = true and name is empty: a new service account is created with a generated name
            #   2. If create = true and name is set: a new service account is created with this name
            #   3. If create = false and name is set: the existing service account with this name will be used
            #   4. If create = false and name is empty: this config is invalid, expect a failure
            #
            # NOTE:
            #   If using an existing service account (i.e., create is set to false), it must have the following permissions:
            #     - resource: secrets, verbs: [get, list]
            #     - resource: podsecuritypolicies, verbs: [use]
            #   Ensure the appropriate Kubernetes RBAC resources are configured to grant these permissions.
            # Immutable: No
            name: ""
          # securityContext defines access control settings for pods deployed as part of subchart
          # Optional; Default: {}
          # runAsUser and runAsGroup are not configurable for the main pod; instead, provided fields will
          # be configured only for the init-container.
          # fsGroup configured here will not be prioritized for this pod; instead, global.securityContext.fsGroup
          # will be prioritized.
          securityContext: {}
          # nodeSelector is the node labels for pod assignment
          # Optional;
          # if set, only following nodeSelector is applied and global nodeSelector ignored
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
          # This value affects both mediaDatabase and media pods
          # nodeSelector:
          #   kubernetes.io/hostname: node1
          # Immutable: No
          nodeSelector: {}
          # affinity controls Pod scheduling preferences.
          # Optional;
          # if set, only following affinity is applied and global affinity ignored
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
          # This value affects both mediaDatabase and media pods
          # Immutable: No
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/worker
                        operator: Exists
                      - key: node-role.kubernetes.io/master
                        operator: DoesNotExist
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          # tolerations is for nodes that have taints on them.
          # Optional;
          # if set, both following tolerations and global tolerations applied
          # Useful if you want to dedicate nodes to just run the cnsbc-media
          # For example:
          # tolerations:
          # - key: "key"
          #   operator: "Equal"
          #   value: "value"
          #   effect: "NoSchedule"
          #
          # ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
          # This value affects both mediaDatabase and media pods
          # Immutable: No
          tolerations: []
          # labels add extra labels to all the resources
          # Optional;
          # if set, both following labels and global labels applied
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
          # Immutable: No
          labels: {}
          # annotations add annotations to all the resources
          # Optional;
          # if set, both following annotations and global annotations applied
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
          # Immutable: No
          annotations: {}
        ##################################################################################
        #
        # End of cnsbc-media Parameters
        #
        ##################################################################################

        ##################################################################################
        #
        # Start of cnsbc transcode controller Parameters
        #
        ##################################################################################
        cnsbc-transcode-controller:
          # transcodeController Information
          transcodeController:
            # image Information about the transcode controller image
            image:
              # registry is the name of the container registry where the transcode controller is available
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the transcode-controller image is available within the registry
              # Required;
              # Immutable: No
              repository: "cnsbc"
              # name is the name of the image in registry
              # Optional; Default: transcode-controller
              # Immutable: No
              name: "transcode-controller"
              # tag is the version number of the image in the registry
              # Optional;
              # Immutable: No
              tag: ""
              # pullPolicy specify a imagePullPolicy
              # Optional; Allowed-values: Always, IfNotPresent, Never; Default: Always
              # Immutable: No
              pullPolicy: "Always"
            # replicas number of transcode-controller replicas to be deployed
            # Optional; Allowed-Values: Any odd number; Default: 3.
            # The replica count should be in odd numbers
            # Immutable: No
            replicas: 3
            # resources is the maximum resources we can allocate to the transcode-controller container
            # Optional;
            # resources:
            #   limits:
            #     memory: "2Gi"
            #     cpu: 2
            # Immutable: No
            resources:
              limits:
                memory: "2Gi"
                cpu: 2
          # nodeSelector is the node labels for pod assignment
          # Optional;
          # if set, only following nodeSelector is applied and global nodeSelector ignored
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
          # nodeSelector:
          #   kubernetes.io/hostname: node1
          nodeSelector: {}
          # affinity controls Pod scheduling preferences.
          # Optional;
          # if set, only following affinity is applied and global affinity ignored
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
          affinity: {}
          # tolerations is for nodes that have taints on them.
          # Optional;
          # if set, both following tolerations and global tolerations applied
          # Useful if you want to dedicate nodes to just run the cnsbc-transcode
          # For example:
          # tolerations:
          # - key: "key"
          #   operator: "Equal"
          #   value: "value"
          #   effect: "NoSchedule"
          #
          # ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
          tolerations: []
          # labels add extra labels to all the resources
          # Optional;
          # if set, both following labels and global labels applied
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
          labels: {}
          # annotations add annotations to all the resources
          # Optional;
          # if set, both following annotations and global annotations applied
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
          annotations: {}
          # securityContext defines access control settings for pods deployed as part of subchart
          # Optional; Default: {}
          securityContext:
            runAsNonRoot: true
        ##################################################################################
        #
        # End of cnsbc transcode controller Parameters
        #
        ##################################################################################

        ##################################################################################
        #
        # Start of cnsbc-transcode Parameters
        #
        ##################################################################################
        cnsbc-transcode:
          # transcode Information about the transcode engine
          transcode:
            # image Information about the transcode engine image
            image:
              # registry is the name of the container registry where the transcode image is available
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the cnsbc-transcode image is available within the registry
              # Required;
              # Immutable: No
              repository: "cnsbc"
              # name is the name of the image in registry
              # Optional; Default: cnsbc-media
              # Immutable: No
              name: "cnsbc-media"
              # tag is the version number of the image in the registry
              # Optional;
              # Immutable: No
              tag: ""
              # pullPolicy specify a imagePullPolicy
              # Optional; Allowed-values: Always, IfNotPresent, Never; Default: Always
              # Immutable: No
              pullPolicy: "Always"
            # resources is the maximum resources we can allocate to the cnsbc-transcode container
            # Optional;
            # cpu limit will be derived from cores configured (signaling + forwarding + xcore)
            # resources:
            #   limits:
            #     memory: "4Gi"
            #     hugepages-2Mi: "2Gi"
            # Immutable: No
            resources:
              limits:
                memory: "4Gi"
                hugepages-2Mi: "2Gi"
            # metricsAllowList is the list of additional metrics that will be exported by the cnsbc-transcode component.
            # Optional; Default: [];
            # These metrics will be added to the default set and included in the ConfigMap used by the application.
            # Do not change this field here. To add additional metrics, specify them in metrics-allowlist.yaml only.
            metricsAllowList: []
            # log defines the log level for processes/tasks in transcode engine
            log:
              # level allows to configure task/process wide logging information
              # Optional; Allowed-values: Fatal, Error, Warn, Info, Debug, trace; Default: Info
              # Immutable: No
              level:
                usbc-proc: "Info"
                usdp-proc: "Info"
            vnics:
              openstack:
                - name: net0
                  network-name: cnsbc_net
                  vips:
                    - 11.0.2.12
          # On SMT-enabled systems with 'full-pcpu-only' enabled in static CPU management:
          # - The total core count assigned to the container must be a multiple of SMT threads per physical core.
          #   For example, with 2 threads per core, total CPUs must be a multiple of 2.
          # - Examples of Valid configurations include:
          #   totalCores = signalingCores + forwardCores + xCores
          #   Ex1: totalCores = 4 = signalingCores:2 + forwardCores:1 + xCores:1
          #   Ex2: totalCores = 4 = signalingCores:1 + forwardCores:1 + xCores:2
          # start of bootstrap section for transcode
          bootstrap:
            # forwardCores number of cores allocated for media processing
            # Optional; Default: 1
            # Immutable: No
            forwardCores: 1
            # signalingCores number of cores allocated for signaling process
            # Optional; Default: 1
            # Immutable: No
            signalingCores: 1
            # xCores number of cores allocated for transcoding
            # Optional; Default: 1
            # Immutable: No
            xCores: 1
          # End of bootstrap section for media

          # start of transcoding database section
          transcodingDatabase:
            # replicas number of transcoding database pods that will be deployed
            # Optional; Default: 3
            # Immutable: No
            replicas: 3
            # resources for transcode database pods
            # On SMT-enabled systems with 'full-pcpu-only' enabled in static CPU management,
            # the total CPU resource limit assigned to a container must be a multiple of SMT threads per physical core.
            # For example, with 2 threads per core, the CPU limit must be a multiple of 2.
            # Optional;
            # resources:
            #   limits:
            #     memory: "1Gi"
            #     cpu: 1
            # Immutable: No
            resources:
              limits:
                memory: "1Gi"
                cpu: 1
            # jvm heap memory for transcode database pods
            # when Heap memory of the transcodingDatabase cluster need to be allocated
            # manually with a certain value, else Operator will
            # allocate the twenty-five percent of transcodingDatabase pod memory as
            # pod heap memory during transcodingDatabase cluster deployment
            # Optional;
            # Immutable: Yes
            jvm:
              memory:
                heapSize: ""
          # End of transcode database section

          # serviceAccount is the service account to create and assign RBAC roles to
          serviceAccount:
            # create specifies whether a service account should be created
            # Optional; Allowed Values: true, false; Default: true
            # Immutable: No
            create: true
            # name of the service account to use.
            # Required if create is false
            # Behavior:
            #   1. If create = true and name is empty: a new service account is created with a generated name
            #   2. If create = true and name is set: a new service account is created with this name
            #   3. If create = false and name is set: the existing service account with this name will be used
            #   4. If create = false and name is empty: this config is invalid, expect a failure
            #
            # NOTE:
            #   If using an existing service account (i.e., create is set to false), it must have the following permissions:
            #     - resource: podsecuritypolicies, verbs: [use]
            #   Ensure the appropriate Kubernetes RBAC resources are configured to grant these permissions.
            # Immutable: No
            name: ""
          # securityContext defines access control settings for pods deployed as part of the subchart
          # Optional; Default: {}
          # runAsUser and runAsGroup is not configurable for the main pod; instead, provided fields will
          # be configured only for the init-container.
          # fsGroup configured here will not be prioritized for this pod; instead, global.securityContext.fsGroup
          # will be prioritized.
          securityContext: {}
          # nodeSelector is the node labels for pod assignment
          # Optional;
          # if set, only following nodeSelector is applied and global nodeSelector ignored
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
          # This value affects both transcodingDatabase and transcode pods
          # nodeSelector:
          #   kubernetes.io/hostname: node1
          # Immutable: No
          nodeSelector: {}
          # affinity controls Pod scheduling preferences.
          # Optional;
          # if set, only following affinity is applied and global affinity ignored
          # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
          # This value affects both transcodingDatabase and transcode pods
          # Immutable: No
          affinity: {}
          # tolerations is for nodes that have taints on them.
          # Optional;
          # if set, both following tolerations and global tolerations applied
          # Useful if you want to dedicate nodes to just run the cnsbc-transcode
          # For example:
          # tolerations:
          # - key: "key"
          #   operator: "Equal"
          #   value: "value"
          #   effect: "NoSchedule"
          #
          # ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
          # This value affects both transcodingDatabase and transcode pods
          # Immutable: No
          tolerations: []
          # labels add extra labels to all the resources
          # Optional;
          # if set, both following labels and global labels applied
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
          # Immutable: No
          labels: {}
          # annotations add annotations to all the resources
          # Optional;
          # if set, both following annotations and global annotations applied
          # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
          # Immutable: No
          annotations: {}
        ##################################################################################
        #
        # End of cnsbc-transcode Parameters
        #
        ##################################################################################

        ##################################################################################
        #
        # Start of HA service manager Parameters
        #
        ##################################################################################
        cnsbc-ha-service-manager:
          # haServiceManager Information about the HA service manager
          haServiceManager:
            # image Information about the HA service manager image
            image:
              # registry is the name of the container registry where the HA service manager image is available
              # Required;
              # Immutable: No
              registry: image-registry.openshift-image-registry.svc:5000
              # repository is the path/folder structure where the HA service manager image is available within the registry
              # Required;
