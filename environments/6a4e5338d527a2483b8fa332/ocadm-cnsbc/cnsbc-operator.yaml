apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnsbc-operator
  namespace: argocd
  labels:
    automated: ""
    ocadmInstanceId: "6aa8eff034808551a79c27a2"
    ocadmInstanceType: cnsbc
    ocadmDeploymentMode: argocd
    ocadmHelmRelease: "ocadm-cnsbc-application"
    ocadmTargetNamespace: "ocadm-cnsbc"
    ocadmTrackingAnchor: "false"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://chartmuseum-helm-repository.apps.ocp1.cgiunet
    chart: cnsbc-operator
    targetRevision: "26.0.3"
    helm:
      releaseName: ocadm-cnsbc-operator
      values: |
        global:
          cloud:
            # type specifies the type of cloud environment
            # Required; Allowed Values:
            # "openstack" for OpenStack CNE deployments that use the cnSBC vnicset operator to attach additional VNICs to the Pod
            # "" for non-OpenStack CNE and OpenStack CNE deployments that use Multus for vnic attachments to the Pod
            type: "openstack"
            # metadata contains details necessary for connecting to the cloud environment
            # cloud provider details can be found from openstack openrc file
            # Required only if cloud type = openstack, otherwise ignored
            metadata:
              # authUrl is the authentication URL for the cloud service
              # Required;
              # Example:
              # authUrl: "http://burling-devtest-cloud-ctrl.us.oracle.com:5000/v3"
              authUrl: http://10.133.97.20:5000
              # domainName is the domain name used for authentication
              # Required;
              # Example: 
              # domainName: "LDAP"
              domainName: Default
              # projectID is the unique identifier for the cloud project
              # Required;
              # Example: 
              # projectID: "b06b25586f544629a90fa943c1b0f51b"
              projectID: 8f27e7b2f6d548ca94c95c1c98b76e8b
              # projectName is the name of the cloud project
              # Required;
              # Example: 
              # projectName: "Nova"
              projectName: network-demos
              # regionName is the region of the cloud service
              # Required;
              # Example: 
              # regionName: "RegionOne"
              regionName: RegionOne
              networks:
                - name: cnsbc_net
                  networkid: e671bbc1-fdaf-4c96-b54a-5cd7e3096112
                  subnetid: 44b4edee-3a11-45c2-bc11-5571421b1942
                  type: pv
                  cidr: 11.0.2.0/24
          repositoryPrefix: cnsbc
          watchNamespaces: ocadm-cnsbc
          imageRegistry: image-registry.openshift-image-registry.svc:5000
        cnsbcvnicset-operator:
          # enabled enable or disable cnsbc vnicset operator chart
          # disable it for non-OpenStack CNE systems and OpenStack CNE systems that use Multus
          # enable it for OpenStack CNE systems that use the cnSBC vnicset operator to attach additional VNICs to the Pod
          # Required; Allowed Values: true, false; Default: false
          enabled: true
          # cloudSecretName specifies the name of the secret used to retrieve Cloud authentication credentials
          # The secret must contain "username" and "password" fields representing the Cloud Username and Password
          # Required;
          cloudSecretName: "openstack-auth"
          # Start of https parameters sub section
          https:
            # cloudProviderClient holds configuration options for the cloud provider client used in secure HTTPS communication.
            cloudProviderClient:
              # enable is a flag to enable or disable https communication with cloud provider
              # When set to "true", the operator will setup https connection
              # When set to "false", it will work with http connection
              # Required; Allowed Values: true, false
              enable: True
              # caCertsConfigMapName specifies the name of the Kubernetes ConfigMap that contains the CA certificates required for TLS verification
              # These certificates are used to establish a trusted connection with the cloud provider
              # Dependencies: if https is enabled, this configmap is required and should be deployed before cnsbc-operators
              caCertsConfigMapName: "cloud-provider-ca-certs"
              # allowSelfSignedCertificates is a flag to allow or disallow self-signed cloud provider server end-entity certificate.
              # When set to "false", self-signed cloud provider server certificate will be rejected during TLS handshake.
              # When set to "true", self-signed cloud provider server certificate will be allowed during TLS handshake.
              # Optional; Allowed Values: true, false; Default: false
              allowSelfSignedCertificates: false
          # crictlConfigFile defines the path to the crictl configuration file on Kubernetes nodes, which can be customized by the user.
          # Optional; Default: ""
          # If specified, that path will be used for the crictl configuration file. This allows users to choose a custom location for the crictl config file.
          # If set to an empty string "", the script defaults to using /etc/crictl.yaml or $HOME/.crictl.yaml.
          crictlConfigFile: ""
        coherence-operator:
          image:
            registry: image-registry.openshift-image-registry.svc:5000
            name: cnsbc/coherence-operator
            tag: 3.5.7
          watchNamespaces: ocadm-cnsbc
        mysql-operator:
          image:
            registry: image-registry.openshift-image-registry.svc:5000
            repository: cnsbc
          envs:
            imagesDefaultRegistry: image-registry.openshift-image-registry.svc:5000
            imagesDefaultRepository: cnsbc

  destination:
    server: https://kubernetes.default.svc
    namespace: ocadm-cnsbc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
